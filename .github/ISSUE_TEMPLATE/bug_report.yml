name: Bug report
description: Report a defect in vault-mem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can — the `doctor` output and audit-log tail are usually what we need most.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands and any sample memories needed to reproduce. Include the MCP client (Claude Code/Desktop/Cursor) and the tool call that triggered the bug.
      placeholder: |
        1. Run `node packages/mcp/bin/vault-mem-mcp init --target /tmp/test-vault`
        2. In Claude Code, ask the agent to call `memory_search` with query "..."
        3. Observe the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: vault-mem version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / ..."
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      description: Where the bug manifests
      placeholder: "Claude Code 2.x / Claude Desktop / Cursor / custom"

  - type: textarea
    id: doctor-mcp
    attributes:
      label: MCP doctor output
      description: Output of `node packages/mcp/bin/vault-mem-mcp doctor --vault <your-vault>`.
      render: shell

  - type: textarea
    id: doctor-keeper
    attributes:
      label: Keeper doctor output (if relevant)
      description: Output of `cd packages/keeper && uv run python -m vault_mem_keeper doctor --vault <your-vault>`.
      render: shell

  - type: textarea
    id: audit-log-tail
    attributes:
      label: Recent audit log
      description: Last 20 lines of `~/vault-mem/_system/audit.log` (sanitize any private content first).
      render: shell

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight check
      options:
        - label: I read the [TROUBLESHOOTING.md](../../docs/TROUBLESHOOTING.md) and my issue isn't covered there
          required: true
        - label: I searched [existing issues](../../issues?q=is%3Aissue) for duplicates
          required: true
