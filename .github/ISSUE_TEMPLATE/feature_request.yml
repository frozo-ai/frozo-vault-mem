name: Feature request
description: Suggest an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like vault-mem to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they don't fit.

  - type: checkboxes
    id: scope
    attributes:
      label: Roadmap fit
      options:
        - label: This is in scope of the [PRD roadmap](../../docs/origin/personal-use-prd.md) (Phase 4 Telegram, Phase 5 contradictions/summarization, Phase 6 polish)
        - label: This is out of the published roadmap (please justify why it's still worth adding to a local-first, single-user tool)

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight check
      options:
        - label: I searched [existing issues](../../issues?q=is%3Aissue) and [discussions](../../discussions) for similar requests
          required: true
